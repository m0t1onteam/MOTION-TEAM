<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ну, погоди! Математика</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: #1a1a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100dvh;
    font-family: 'Courier New', monospace;
    overflow-y: auto;
    padding: 20px 0 80px 0;
    user-select: none;
  }
  #game {
    background: #9bbc0f;
    border: 8px solid #306230;
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(155,188,15,0.5);
    position: relative;
    margin-bottom: 85px;
  }
  canvas { display: block; }

  #ui {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 8px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #0f380f;
    font-weight: bold;
    font-size: 13px;
    pointer-events: none;
  }
  #ui .item { display: flex; align-items: center; gap: 4px; }
  #timer.urgent { color: #8b0000; animation: pulse 0.5s infinite; }
  @keyframes pulse { 50% { opacity: 0.3; } }

  #target {
    position: absolute;
    top: 38px;
    left: 50%;
    transform: translateX(-50%);
    background: #0f380f;
    color: #9bbc0f;
    padding: 5px 14px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    border: 3px solid #306230;
    white-space: nowrap;
  }

  #message {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 28px;
    font-weight: bold;
    color: #0f380f;
    text-shadow: 2px 2px 0 #9bbc0f, -2px -2px 0 #9bbc0f;
    display: none;
    text-align: center;
    pointer-events: none;
    z-index: 5;
  }

  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(15,56,15,0.95);
    color: #9bbc0f;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-size: 16px;
    gap: 10px;
    padding: 16px;
    text-align: center;
    z-index: 10;
    overflow-y: auto;
  }
  .overlay h1 { font-size: 24px; margin-bottom: 4px; }
  .overlay button {
    background: #9bbc0f;
    color: #0f380f;
    border: none;
    padding: 10px 22px;
    font-size: 15px;
    font-weight: bold;
    font-family: inherit;
    border-radius: 8px;
    cursor: pointer;
    margin: 3px;
  }
  .overlay button:hover { background: #8aad0d; }
  .overlay button.secondary {
    background: transparent;
    color: #9bbc0f;
    border: 2px solid #9bbc0f;
    padding: 8px 18px;
    font-size: 13px;
  }
  .stats {
    background: rgba(155,188,15,0.1);
    border: 2px solid #9bbc0f;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.5;
    text-align: left;
    min-width: 240px;
    max-width: 340px;
  }
  .stats b { color: #c8e04a; }

  .records-scroll {
    max-height: 170px;
    overflow-y: auto;
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 4px;
  }
  .records-scroll::-webkit-scrollbar { width: 6px; }
  .records-scroll::-webkit-scrollbar-thumb { background: #9bbc0f; border-radius: 3px; }

  .records-block {
    background: rgba(155,188,15,0.08);
    border: 2px solid #9bbc0f;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 11px;
  }
  .records-title {
    font-weight: bold;
    font-size: 12px;
    text-align: center;
    margin-bottom: 4px;
    padding-bottom: 4px;
    border-bottom: 1px solid rgba(155,188,15,0.3);
    color: #c8e04a;
  }
  .record-row {
    display: grid;
    grid-template-columns: 22px 38px 1fr auto;
    gap: 5px;
    align-items: center;
    padding: 2px 0;
    border-bottom: 1px dashed rgba(155,188,15,0.15);
  }
  .record-row:last-child { border-bottom: none; }
  .medal { font-size: 13px; text-align: center; }
  .score-val { font-weight: bold; color: #c8e04a; }
  .rec-info { font-size: 9px; opacity: 0.85; }
  .rec-date { font-size: 9px; opacity: 0.6; }

  .new-record {
    background: linear-gradient(90deg, #9bbc0f, #c8e04a);
    color: #0f380f;
    padding: 6px 12px;
    border-radius: 6px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 8px;
    animation: recordPulse 0.8s ease-in-out infinite alternate;
  }
  @keyframes recordPulse {
    from { transform: scale(1); box-shadow: 0 0 0 rgba(200,224,74,0.8); }
    to   { transform: scale(1.03); box-shadow: 0 0 20px rgba(200,224,74,0.6); }
  }

  #controls {
    position: absolute;
    bottom: -75px;
    left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 20px;
  }
  #controls button {
    background: #306230;
    color: #9bbc0f;
    border: none;
    width: 65px; height: 65px;
    font-size: 26px;
    border-radius: 50%;
    font-family: inherit;
    cursor: pointer;
    user-select: none;
  }
  #controls button:active { background: #0f380f; }

  @media (max-width: 450px) {
    #game { border-width: 5px; }
    #controls button { width: 55px; height: 55px; font-size: 22px; }
    .overlay h1 { font-size: 20px; }
  }
</style>
</head>
<body>
<div id="game">
  <canvas id="canvas" width="400" height="600"></canvas>

  <div id="ui">
    <span class="item">❤️ <span id="lives">3</span></span>
    <span class="item" id="timerWrap" style="display:none;">⏱ <span id="timer">60</span></span>
    <span class="item">Ур. <span id="level">1</span></span>
    <span class="item">⭐ <span id="score">0</span></span>
  </div>

  <div id="target">ЦЕЛЬ: <span id="targetVal">10</span></div>
  <div id="message"></div>

  <div class="overlay" id="menu" style="display:flex;">
    <h1>🐺 НУ, ПОГОДИ! 🐰</h1>
    <div style="font-size:13px; opacity:0.8;">Математическая аркада</div>
    <div>
      <button onclick="startGame('classic')">🎮 Классика</button>
      <button onclick="startGame('blitz')">⚡ Блиц 60 сек</button>
    </div>
    <div class="records-scroll" id="menuRecords"></div>
    <div style="font-size:11px; opacity:0.7;">
      ← → или A/D или свайп
    </div>
  </div>

  <div class="overlay" id="gameover">
    <h1 id="goTitle">🐺 НУ, ПОГОДИ!</h1>
    <div id="goSub">Игра окончена</div>
    <div class="stats" id="stats"></div>
    <div class="records-scroll" id="recordsContainer"></div>
    <div>
            <button onclick="startGame(mode)">🔄 Ещё раз</button>
      <button class="secondary" onclick="showMenu()">🏠 Меню</button>
    </div>
  </div>

  <div id="controls">
    <button id="btnLeft" type="button" aria-label="Влево">◀</button>
    <button id="btnRight" type="button" aria-label="Вправо">▶</button>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const C = { light: '#9bbc0f', mid: '#8bac0f', dark: '#306230', darkest: '#0f380f' };
const $ = id => document.getElementById(id);

const BASKET_Y = 520;
const RECORDS_KEY = 'nupogodi_math_records';
const MODES = { classic: '🎮 Классика', blitz: '⚡ Блиц' };

let mode = 'classic';
let running = false;
let state = null;
let lastTime = 0;
let keys = { left: false, right: false };
let pointerX = null;

/* ===== Масштаб под экран ===== */
function fitCanvas() {
  const maxW = Math.min(400, window.innerWidth - 24);
  const maxH = window.innerHeight - 140;
  const scale = Math.min(maxW / W, maxH / H, 1);
  canvas.style.width = Math.round(W * scale) + 'px';
  canvas.style.height = Math.round(H * scale) + 'px';
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

/* ===== Примеры ===== */
function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }

function newTarget(level) {
  if (level <= 1) return rnd(5, 10);
  if (level <= 3) return rnd(8, 20);
  return rnd(10, 30);
}

function makeExpr(value, level) {
  const ops = ['+'];
  if (level >= 2) ops.push('-');
  if (level >= 4) ops.push('×');
  for (let i = 0; i < 20; i++) {
    const op = ops[rnd(0, ops.length - 1)];
    if (op === '+') {
      const a = rnd(0, value);
      return a + '+' + (value - a);
    }
    if (op === '-') {
      const b = rnd(1, 10);
      return (value + b) + '-' + b;
    }
    if (op === '×') {
      const divs = [];
      for (let d = 2; d <= 9; d++) if (value % d === 0 && value / d <= 10) divs.push(d);
      if (divs.length) {
        const d = divs[rnd(0, divs.length - 1)];
        return d + '×' + (value / d);
      }
    }
  }
  const a = rnd(0, value);
  return a + '+' + (value - a);
}

function spawnItem() {
  const s = state;
  const correct = Math.random() < 0.45;
  let value = s.target;
  if (!correct) {
    do { value = s.target + rnd(-3, 3); } while (value === s.target || value < 0);
  }
  s.items.push({
    x: rnd(45, W - 45),
    y: 70,
    value,
    text: makeExpr(value, s.level),
    speed: 70 + s.level * 18 + rnd(0, 25)
  });
}

/* ===== Игра ===== */
function startGame(m) {
  mode = m;
  state = {
    lives: 3,
    score: 0,
    level: 1,
    correct: 0,
    wrong: 0,
    streak: 0,
    levelHits: 0,
    target: 0,
    time: 60,
    wolfX: W / 2,
    items: [],
    spawnTimer: 0,
    msgTimer: 0,
    flash: 0
  };
  state.target = newTarget(1);
  $('menu').style.display = 'none';
  $('gameover').style.display = 'none';
  $('timerWrap').style.display = mode === 'blitz' ? '' : 'none';
  updateUI();
  showMessage('ПОЕХАЛИ!');
  running = true;
  lastTime = performance.now();
  requestAnimationFrame(loop);
}

function showMenu() {
  running = false;
  $('gameover').style.display = 'none';
  $('menu').style.display = 'flex';
  renderRecords($('menuRecords'));
  drawScene();
}

function updateUI() {
  const s = state;
  $('lives').textContent = mode === 'blitz' ? '∞' : s.lives;
  $('score').textContent = s.score;
  $('level').textContent = s.level;
  $('targetVal').textContent = s.target;
  const t = Math.max(0, Math.ceil(s.time));
  $('timer').textContent = t;
  $('timer').classList.toggle('urgent', mode === 'blitz' && t <= 10);
}

function showMessage(text) {
  const el = $('message');
  el.textContent = text;
  el.style.display = 'block';
  state.msgTimer = 1.1;
}

function onCatch(item) {
  const s = state;
  if (item.value === s.target) {
    s.correct++;
    s.streak++;
    s.levelHits++;
    s.score += 10 * s.level + Math.min(s.streak, 10) * 2;
    if (mode === 'blitz') s.time += 2;
    if (s.levelHits >= 5) {
      s.level++;
      s.levelHits = 0;
      s.target = newTarget(s.level);
      s.items = s.items.filter(it => it.y > H); // очищаем поле
      showMessage('УРОВЕНЬ ' + s.level + '!');
    } else if (s.streak > 0 && s.streak % 5 === 0) {
      showMessage('СЕРИЯ ×' + s.streak);
    }
  } else {
    s.wrong++;
    s.streak = 0;
    s.flash = 0.3;
    if (mode === 'blitz') {
      s.time -= 5;
      showMessage(item.text + ' = ' + item.value + '  −5 сек');
    } else {
      s.lives--;
      showMessage(item.text + ' = ' + item.value);
    }
  }
}

function onMiss(item) {
  const s = state;
  if (item.value !== s.target) return;
  s.streak = 0;
  if (mode === 'classic') {
    s.lives--;
    s.flash = 0.3;
    showMessage('ПРОПУСТИЛ!');
  }
}

function update(dt) {
  const s = state;

  // движение волка
  const speed = 380;
  if (keys.left) s.wolfX -= speed * dt;
  if (keys.right) s.wolfX += speed * dt;
  if (pointerX !== null) {
    const diff = pointerX - s.wolfX;
    s.wolfX += Math.sign(diff) * Math.min(Math.abs(diff), speed * 1.5 * dt);
  }
  s.wolfX = Math.max(45, Math.min(W - 45, s.wolfX));

  // появление
  s.spawnTimer -= dt;
  if (s.spawnTimer <= 0) {
    spawnItem();
    s.spawnTimer = Math.max(0.55, 1.4 - s.level * 0.1);
  }

  // падение и ловля
  for (let i = s.items.length - 1; i >= 0; i--) {
    const it = s.items[i];
    it.y += it.speed * dt;
    if (it.y >= BASKET_Y - 18 && it.y <= BASKET_Y + 10 && Math.abs(it.x - s.wolfX) < 52) {
      s.items.splice(i, 1);
      onCatch(it);
    } else if (it.y > H + 30) {
      s.items.splice(i, 1);
      onMiss(it);
    }
  }

  if (mode === 'blitz') s.time -= dt;
  if (s.msgTimer > 0) {
    s.msgTimer -= dt;
    if (s.msgTimer <= 0) $('message').style.display = 'none';
  }
  if (s.flash > 0) s.flash -= dt;

  updateUI();

  if ((mode === 'classic' && s.lives <= 0) || (mode === 'blitz' && s.time <= 0)) endGame();
}

function loop(now) {
  if (!running) return;
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  update(dt);
  drawScene();
  if (running) requestAnimationFrame(loop);
}

/* ===== Рисование ===== */
function drawScene() {
  ctx.fillStyle = C.light;
  ctx.fillRect(0, 0, W, H);

  // курятник-желоба
  ctx.strokeStyle = C.mid;
  ctx.lineWidth = 2;
  for (let y = 90; y < 480; y += 60) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  // земля
  ctx.fillStyle = C.dark;
  ctx.fillRect(0, H - 22, W, 22);

  if (!state) return;

  if (state.flash > 0) {
    ctx.fillStyle = 'rgba(139,0,0,0.25)';
    ctx.fillRect(0, 0, W, H);
  }

  // яйца с примерами
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 17px Courier New, monospace';
  for (const it of state.items) {
    ctx.fillStyle = '#e8f5c0';
    ctx.strokeStyle = C.darkest;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(it.x, it.y, 38, 22, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = C.darkest;
    ctx.fillText(it.text, it.x, it.y + 1);
  }

  drawWolf(state.wolfX);
}

function drawWolf(x) {
  const y = BASKET_Y;
  ctx.fillStyle = C.darkest;
  ctx.strokeStyle = C.darkest;

  // тело
  ctx.fillRect(x - 16, y + 18, 32, 40);
  // ноги
  ctx.fillRect(x - 14, y + 56, 10, 22);
  ctx.fillRect(x + 4, y + 56, 10, 22);
  // голова
  ctx.beginPath(); ctx.ellipse(x, y + 4, 20, 16, 0, 0, Math.PI * 2); ctx.fill();
  // уши
  ctx.beginPath(); ctx.moveTo(x - 18, y - 4); ctx.lineTo(x - 12, y - 24); ctx.lineTo(x - 4, y - 8); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + 18, y - 4); ctx.lineTo(x + 12, y - 24); ctx.lineTo(x + 4, y - 8); ctx.fill();
  // глаза
  ctx.fillStyle = C.light;
  ctx.fillRect(x - 9, y - 1, 5, 5);
  ctx.fillRect(x + 4, y - 1, 5, 5);

  // корзина
  ctx.fillStyle = C.dark;
  ctx.strokeStyle = C.darkest;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x - 48, y - 14);
  ctx.lineTo(x + 48, y - 14);
  ctx.lineTo(x + 38, y + 10);
  ctx.lineTo(x - 38, y + 10);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = C.light;
  ctx.lineWidth = 1;
  for (let i = -30; i <= 30; i += 15) {
    ctx.beginPath(); ctx.moveTo(x + i, y - 12); ctx.lineTo(x + i * 0.85, y + 8); ctx.stroke();
  }
}

/* ===== Рекорды ===== */
function loadRecords() {
  try {
    const r = JSON.parse(localStorage.getItem(RECORDS_KEY));
    if (r && r.classic && r.blitz) return r;
  } catch (e) {}
  return { classic: [], blitz: [] };
}

function saveRecord() {
  const recs = loadRecords();
  const list = recs[mode];
  const entry = {
    score: state.score,
    level: state.level,
    correct: state.correct,
    date: new Date().toLocaleDateString('ru-RU'),
    id: Date.now()
  };
  list.push(entry);
  list.sort((a, b) => b.score - a.score);
  recs[mode] = list.slice(0, 5);
  try { localStorage.setItem(RECORDS_KEY, JSON.stringify(recs)); } catch (e) {}
  const place = recs[mode].findIndex(r => r.id === entry.id);
  return { place, isBest: place === 0 && state.score > 0 };
}

function renderRecords(container, highlightId) {
  const recs = loadRecords();
  const medals = ['🥇', '🥈', '🥉', '4.', '5.'];
  let html = '';
  for (const m of ['classic', 'blitz']) {
    html += '<div class="records-block"><div class="records-title">' + MODES[m] + ' — рекорды</div>';
    if (!recs[m].length) {
      html += '<div style="text-align:center;opacity:0.6;">Пока пусто</div>';
    } else {
      recs[m].forEach((r, i) => {
        const hl = r.id === highlightId ? ' style="background:rgba(200,224,74,0.2);"' : '';
        html += '<div class="record-row"' + hl + '>' +
          '<span class="medal">' + medals[i] + '</span>' +
          '<span class="score-val">' + r.score + '</span>' +
          '<span class="rec-info">ур. ' + r.level + ' · верно ' + r.correct + '</span>' +
          '<span class="rec-date">' + r.date + '</span></div>';
      });
    }
    html += '</div>';
  }
  container.innerHTML = html;
}

function endGame() {
  running = false;
  $('message').style.display = 'none';
  const res = saveRecord();
  const recs = loadRecords();
  const entry = res.place >= 0 ? recs[mode][res.place] : null;

  $('goTitle').textContent = mode === 'blitz' ? '⏱ ВРЕМЯ ВЫШЛО!' : '🐺 НУ, ПОГОДИ!';
  $('goSub').textContent = MODES[mode] + ' · игра окончена';
  const total = state.correct + state.wrong;
  const acc = total ? Math.round(state.correct / total * 100) : 0;
  $('stats').innerHTML =
    (res.isBest ? '<div class="new-record">🏆 НОВЫЙ РЕКОРД!</div>' : '') +
    'Очки: <b>' + state.score + '</b><br>' +
    'Уровень: <b>' + state.level + '</b><br>' +
    'Поймано верных: <b>' + state.correct + '</b><br>' +
    'Ошибок: <b>' + state.wrong + '</b><br>' +
    'Точность: <b>' + acc + '%</b>';
  renderRecords($('recordsContainer'), entry ? entry.id : null);
  $('gameover').style.display = 'flex';
}

/* ===== Управление ===== */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A' || e.key === 'ф' || e.key === 'Ф') { keys.left = true; e.preventDefault(); }
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D' || e.key === 'в' || e.key === 'В') { keys.right = true; e.preventDefault(); }
  if (e.key === 'Escape' && window.parent !== window) {
    try { window.parent.closeMiniGame(); } catch (err) {}
  }
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A' || e.key === 'ф' || e.key === 'Ф') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D' || e.key === 'в' || e.key === 'В') keys.right = false;
});
window.addEventListener('blur', () => { keys.left = keys.right = false; pointerX = null; });

function holdButton(btn, dir) {
  const on = e => { e.preventDefault(); keys[dir] = true; };
  const off = () => { keys[dir] = false; };
  btn.addEventListener('pointerdown', on);
  btn.addEventListener('pointerup', off);
  btn.addEventListener('pointerleave', off);
  btn.addEventListener('pointercancel', off);
  btn.addEventListener('contextmenu', e => e.preventDefault());
}
holdButton($('btnLeft'), 'left');
holdButton($('btnRight'), 'right');

// свайп / перетаскивание по полю
function canvasX(clientX) {
  const r = canvas.getBoundingClientRect();
  return (clientX - r.left) * (W / r.width);
}
canvas.addEventListener('touchstart', e => { pointerX = canvasX(e.touches[0].clientX); e.preventDefault(); }, { passive: false });
canvas.addEventListener('touchmove', e => { pointerX = canvasX(e.touches[0].clientX); e.preventDefault(); }, { passive: false });
canvas.addEventListener('touchend', () => { pointerX = null; });
canvas.addEventListener('touchcancel', () => { pointerX = null; });

/* ===== Старт ===== */
renderRecords($('menuRecords'));
drawScene();
</script>
</body>
</html>
